[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arcagi"
version = "0.1.0"
description = "ARC-AGI Data Augmentation Tools"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy", 
    "matplotlib",
    "tqdm",
    "transformers==4.57.3",
    "accelerate==1.12.0",
    "ipython==9.8.0",
    "hf-transfer==0.1.9",
    "bitsandbytes>=0.41.0",
]

# Optional: Add scripts to run your augmentation easily
# usage: arc-aug
[project.scripts]
arc-aug = "my_package_name.augment:main"
